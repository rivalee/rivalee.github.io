---
layout: default
---
<article class="post">

  <header class="post-header">
    {% if page.show_home_link_top %}
      <p><a class="back-link" href="/">&larr; Back</a></p>
    {% endif %}
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
